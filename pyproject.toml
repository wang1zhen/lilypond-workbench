[project]
name = "lilypond-workbench"
version = "1.0.0"
description = "Codex skill and deterministic tools for LilyPond score workflows"
requires-python = ">=3.11"
dependencies = [
    "music21>=10.5.0",
    "python-ly>=0.9.10",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "integration: requires system LilyPond or LaTeX tools",
    "latex: requires lilypond-book and a LuaLaTeX publishing toolchain",
]
testpaths = ["tests"]
